# GitHub Actions 等价实现（与 ../.workflow/qa-e2e.yml 同一意图，便于跨平台迁移）
#
# 为什么要两套：流程层应当可替换，用例资产与内核不应被某个 CI 平台绑架。
# 退出码语义见 docs/15-runbook.md §10：0 通过 / 1 用例失败 / 2 配置错误 / 3 环境未就绪。

name: qa-e2e

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}   # 允许手工触发（首次接入 GitHub 时便于立即验证）

permissions:
  contents: read

concurrency:
  group: qa-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  static:
    name: 静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: 安装依赖
        run: python -m pip install -q -r labs/requirements.txt -r labs/07-real-project/requirements.txt
      - name: 语法与配置校验
        run: |
          python -m compileall -q atf labs/07-real-project/tests
          python -m atf validate
          python -m atf validate --project static-demo
          python scripts/build_docs_index.py --check

  e2e:
    name: 端到端（两个项目）
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: 安装依赖与浏览器
        run: |
          python -m pip install -q -r labs/requirements.txt -r labs/07-real-project/requirements.txt
          python -m playwright install --with-deps chromium
      - name: 项目 1（Wagtail 全栈）
        run: python -m atf e2e --project wagtail-demo --filing mock --tracker both
      - name: 项目 2（静态站点）
        run: python -m atf e2e --project static-demo
      - name: 归档产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-runs
          path: atf/e2e-runs/
          retention-days: 7

  accept:
    name: 主干验收（连跑 3 次一致）
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install -q -r labs/requirements.txt -r labs/07-real-project/requirements.txt
          python -m playwright install --with-deps chromium
      - name: 一致性验收
        run: python -m atf e2e --project wagtail-demo --filing dry-run --tracker both --repeat 3