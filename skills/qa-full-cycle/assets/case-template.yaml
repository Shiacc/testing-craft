# 用例条目模板 · qa-full-cycle
#
# 用法：整段复制到下一条，改值；字段约束见 references/case-library-spec.md
# 存储：用例库可以是单个 YAML 列表，也可以每模块一个文件。字段名即列名，勿改。
#
# 三条最容易漏的：
#   1) 判定标准写不成断言 → 这条不该进库（进"待澄清"，那通常是需求缺陷）
#   2) status=automated 却没有能解析的 automated_by → 这是假自动化，面板会骗人
#   3) id 改过名 → 历史报告、缺陷单、复盘的回链全部断掉

- id: CART-004                          # 模块-序号，序号 3 位补零；全局唯一，永不复用
  title: 购物车数量改为 0 时提交按钮不可用        # ≤80 字；"在什么条件下验证什么"
  layer: L3                            # L1 单元 / L2 组件 / L3 接口 / L4 端到端 / L5 性能
  priority: P0                         # P0 只给资金、权限、核心链路、历史逃逸缺陷
  tags: [smoke, regression]            # 至少一个 CI 能选择的标签，否则永远不会被跑到
  requirement: RULE-R2,BUG-1042        # 需求号 / 规则号 / 缺陷号；确无出处写 "-"（不得进 P0）
  status: automated                    # manual → automated → deprecated；状态机见规范 §2
  automated_by: tests/test_cart_api.py::test_qty_zero_blocks_checkout
                                       # 仓库相对路径::pytest 节点；必须能解析到真实测试
                                       # 解析失败 → 立刻回退 manual，不许留悬空
  owner: team-ordering                 # 团队名或工号；不许 "全体"；离职即失效
  last_run: 2026-11-16                 # YYYY-MM-DD，最近一次真实执行日期；不得是未来
  last_result: pass                    # pass / fail / skipped / not_run；与 last_run 同生同死

  # ---- 以下为可选 ----------
  x-assertion: >                       # 判定标准的原文，供去重与巡检比对
    数量为 0 时 POST /basket/ 返回 400，错误码 QTY_INVALID；
    响应体不含 order_id，且结算入口 data-testid=checkout-disabled。
  x-evidence: runs/20261116-153753-3bd7/artifacts/test_qty_zero_blocks_checkout.png
  x-quarantine_until: null             # 仅 tag 含 flaky 时填，≤30 天，到期必须出区或删
  x-deprecated_reason: null            # 仅 status=deprecated 时填，必须写
  x-superseded_by: null                # 被新用例替代时填新 id
  x-jira_key: null                     # 关联工单号，便于双向回链

- id: PRICE-012
  title: 会员折扣后金额低于门槛时满减券不生效
  layer: L1
  priority: P0
  tags: [smoke, regression]
  requirement: RULE-R3
  status: manual                       # 还没写自动化：manual 是诚实状态，不是失败
  automated_by: null                   # manual 时留空，不写 "无"
  owner: team-pricing
  last_run: null
  last_result: null

  x-assertion: >
    金卡用户购物车 1 件 100.00 元，应用 10% 会员折扣后 90.00 元，
    低于满减券 SAVE10 的 100.00 门槛，故 payable=90.00、coupon_discount=0.00。
  x-pending_reason: 折扣叠加规则的产品口径待确认（对应需求 REQ-2026-118 §3.2 争议项）