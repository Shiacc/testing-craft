# GitHub Actions 等价实现（用于对比"同一套意图在不同平台上的表达"）。
# 把它与 ../gitee-go/pipeline.yml 并排放，可以看到：工具不同，分层与门禁逻辑不变。
# 这正是 docs/01 §5.1 的观点——流程层应当可以更换，用例资产不应被流程层绑架。

name: testing-craft-ci

on:
  push:
    branches: [master, "release/*"]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  static:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 语法检查
        run: python -m compileall -q labs/01-unit-pytest/src labs/02-api-contract/app

  fast:
    name: 快轨（单元 + 接口）
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: 安装依赖
        run: python -m pip install -q -r labs/requirements.txt
      - name: 运行分片
        working-directory: labs/05-ci
        run: |
          python scripts/ci_local.py --suites unit,api --shards 2 --budget 120
      - name: 上传 JUnit 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-fast-${{ matrix.shard }}
          path: labs/05-ci/.ci-results/*.xml
          retention-days: 7

  ui:
    name: UI 核心旅程
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装依赖与浏览器
        run: |
          python -m pip install -q -r labs/requirements.txt
          # 企业内网环境应改为指向内部镜像；此处用 Playwright 官方源
          python -m playwright install --with-deps chromium
      - name: 运行 smoke
        working-directory: labs/03-ui-playwright
        run: python -m pytest -q -m smoke --junitxml=../../.ci-results/ui-smoke.xml
      - name: 失败时归档截图与 trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifacts
          path: labs/03-ui-playwright/artifacts/
          retention-days: 7

  slow:
    name: 慢轨（全量 + 性能）
    needs: [fast]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install -q -r labs/requirements.txt
      - name: 全量回归
        working-directory: labs/05-ci
        run: python scripts/ci_local.py --full --shards 4 --budget 600
      - name: 性能门禁
        working-directory: labs/04-perf
        run: python py_load_smoke.py --concurrency 20 --requests 500 --p95 200 --p99 500
      - name: 归档汇总报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary
          path: labs/05-ci/.ci-results/summary.md